name: Public Suffix List freshness
on:
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-suffix-freshness
  cancel-in-progress: false
jobs:
  freshness:
    name: Diff the bundled snapshot against publicsuffix.org
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the bundled Public Suffix List
        id: psl
        run: pnpm psl:check
      - name: Report the failed check on an issue
        if: failure() && steps.psl.conclusion == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = "Public Suffix List freshness check failed";
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `The freshness check is still failing: ${run}`,
              });
              core.warning(`PSL check failure tracked in #${existing.number}`);
              return;
            }
            const { data } = await github.rest.issues.create({
              owner, repo, title,
              body: [
                `The weekly Public Suffix List check failed: ${run}`,
                "",
                "Inspect the run log to distinguish upstream rule changes from a fetch failure.",
                "For rule changes, run `pnpm psl:update` from this repository's root,",
                "review the snapshot diff, run the package checks and tests, and open a `fix:` PR.",
                "The snapshot controls which wildcard redirect URIs are accepted.",
                "Close this issue after the check passes again.",
              ].join("\n"),
            });
            core.warning(`Opened #${data.number} for the PSL check failure`);
